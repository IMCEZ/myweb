<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="MeshChat 封面">
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#075985"/>
      <stop offset="0.5" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="mc-glow" cx="0.4" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="mc-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#mc-bg)"/>
  <rect width="800" height="480" fill="url(#mc-grid)"/>
  <rect width="800" height="480" fill="url(#mc-glow)"/>

  <!-- 去中心化的网状拓扑：每个节点直连，没有中心服务器 -->
  <g stroke="url(#mc-line)" stroke-width="1.8" fill="none">
    <path d="M300 96 L452 150 L596 118"/>
    <path d="M300 96 L392 236"/>
    <path d="M452 150 L392 236 L512 248"/>
    <path d="M596 118 L512 248 L620 196"/>
    <path d="M392 236 L330 320"/>
    <path d="M512 248 L520 338"/>
    <path d="M330 320 L452 356 L520 338"/>
    <path d="M620 196 L676 268 L520 338"/>
    <path d="M300 96 L336 176 L392 236"/>
  </g>

  <!-- 节点 -->
  <g fill="#7dd3fc">
    <circle cx="300" cy="96"  r="7"/>
    <circle cx="452" cy="150" r="9"/>
    <circle cx="596" cy="118" r="5.5"/>
    <circle cx="392" cy="236" r="6.5"/>
    <circle cx="512" cy="248" r="7.5"/>
    <circle cx="620" cy="196" r="4.5"/>
    <circle cx="330" cy="320" r="5"/>
    <circle cx="452" cy="356" r="6"/>
    <circle cx="520" cy="338" r="8"/>
    <circle cx="676" cy="268" r="4"/>
    <circle cx="336" cy="176" r="3.6"/>
  </g>
  <!-- 呼吸中的信号脉冲 -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.6">
    <circle cx="452" cy="150" r="18" stroke-opacity="0.45"/>
    <circle cx="452" cy="150" r="30" stroke-opacity="0.22"/>
    <circle cx="520" cy="338" r="16" stroke-opacity="0.38"/>
  </g>

  <text x="56" y="392" fill="#f0f9ff" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="700" letter-spacing="1">MeshChat</text>
  <text x="58" y="426" fill="#7dd3fc" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" letter-spacing="3.4">DECENTRALIZED MESH MESSENGER</text>
</svg>
