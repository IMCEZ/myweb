<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ide-Chen (IDR) · 开发者作品集</title>
  <meta name="description" content="Ide-Chen（代号 IDR）的个人作品集：Web 开发作品、开源项目与技术实验。">
  <meta name="author" content="Ide-Chen (IDR)">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/theme-init.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header data-idr-nav></header>

  <main id="main">
    <!-- ============================ 首屏 ============================ -->
    <section class="hero">
      <div class="container hero__grid">
        <div class="hero__inner">
          <div class="hero__kicker"><span class="dot"></span><span data-hero-kicker>HELLO, WORLD</span></div>
          <h1 class="hero__title" data-hero-title></h1>
          <p class="hero__subtitle" data-hero-subtitle></p>
          <div class="hero__cta" data-hero-cta></div>
          <div class="hero__stats" data-hero-stats></div>
        </div>
        <div class="hero__art" data-hero-art aria-hidden="true"></div>
      </div>
    </section>

    <!-- ============================ 每日一语 ============================ -->
    <section class="section section--tight" id="daily" style="padding-top:0">
      <div class="container">
        <div class="quote-card" data-daily-quote hidden>
          <span class="quote-card__mark" aria-hidden="true">”</span>
          <div class="quote-card__head">
            <span class="quote-card__label">每日一语</span>
            <span class="quote-card__count" data-quote-count></span>
          </div>
          <blockquote class="quote-card__body">
            <p class="quote-card__text" data-quote-text></p>
            <footer class="quote-card__source" data-quote-source></footer>
            <!-- 完整格式（语录---《出处》）供复制与无障碍读取 -->
            <span class="sr-only" data-quote-full></span>
          </blockquote>
          <button class="quote-card__refresh" type="button" data-quote-refresh title="换一句">
            <span class="quote-card__refresh-icon" data-quote-icon></span>
            换一句
          </button>
        </div>
      </div>
    </section>

    <!-- ============================ 精选作品 ============================ -->
    <section class="section" id="works" style="padding-top:0">
      <div class="container">
        <div class="section-head" data-reveal>
          <div class="section-head__text">
            <div class="section-kicker">作品</div>
            <h2 class="section-title">最近在做的东西</h2>
            <p class="section-subtitle">挑了几个自己比较满意的，点进去可以看到完整的来龙去脉。</p>
          </div>
          <a class="btn btn--ghost btn--sm" href="projects.html">全部作品</a>
        </div>
        <div class="grid grid--featured" data-featured-works>
          <div class="loading"><div class="spinner"></div>正在加载作品…</div>
        </div>
      </div>
    </section>

    <!-- ============================ 技能 ============================ -->
    <section class="section section--subtle" id="skills">
      <div class="container">
        <div class="section-head" data-reveal>
          <div class="section-head__text">
            <div class="section-kicker">能力</div>
            <h2 class="section-title" data-skills-title>技能与工具</h2>
            <p class="section-subtitle" data-skills-subtitle></p>
          </div>
        </div>
        <div class="skills" data-skills></div>
      </div>
    </section>

    <!-- ============================ 关于摘要 ============================ -->
    <section class="section" id="about">
      <div class="container container--narrow">
        <div data-reveal>
          <div class="section-kicker">关于</div>
          <p class="about-lead" data-about-lead></p>
          <div class="prose-block" data-about-text></div>
        </div>
      </div>
    </section>

    <!-- ============================ 联系 ============================ -->
    <section class="section" id="contact" style="padding-top:0">
      <div class="container">
        <div class="contact" data-reveal>
          <div class="section-kicker" style="justify-content:center">联系</div>
          <h2 class="contact__title" data-contact-title>联系我</h2>
          <p class="contact__subtitle" data-contact-subtitle></p>
          <div class="contact__actions" data-contact-actions></div>
          <div class="socials" data-contact-socials></div>
          <div class="contact__meta" data-contact-meta></div>
        </div>
      </div>
    </section>
  </main>

  <footer data-idr-footer></footer>

  <script src="assets/js/markdown.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/quote-card.js" defer></script>
  <script src="assets/js/page-home.js" defer></script>
  <script src="assets/js/boot.js" defer></script>
</body>
</html>
